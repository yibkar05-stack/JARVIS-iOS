name: Build WebDriverAgent IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [tactil-wda]
    paths: [.github/workflows/build-wda.yml]

jobs:
  build-wda:
    runs-on: macos-15
    steps:
      - name: Checkout JARVIS-iOS (host repo)
        uses: actions/checkout@v4

      - name: Checkout appium/WebDriverAgent v10.5.4
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v10.5.4
          path: WebDriverAgent-src

      - name: Xcode version
        run: |
          ls -d /Applications/Xcode_*.app || true
          xcodebuild -version

      - name: Build WebDriverAgentRunner (unsigned, build-for-testing)
        working-directory: WebDriverAgent-src
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$GITHUB_WORKSPACE/build/xcodebuild.log"

      - name: Strip embedded XCTest stack + compatibility guard (iOS 16)
        run: |
          set -euo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" -name 'WebDriverAgentRunner-Runner.app' -type d | head -n 1)
          echo "Runner app: $APP_PATH"
          echo "--- Frameworks ANTES del strip ---"
          ls "$APP_PATH/Frameworks" || true
          # Xcode >=16 incrusta en el runner una pila XCTest propia (Testing.framework
          # exige lib_TestingInterop.dylib, inexistente en iOS 16.7 -> DYLD abort).
          # Los builds de la era Xcode 15 NO incrustaban esa pila: el runner usa el
          # XCTest del propio dispositivo (DDI). Se retira la pila incrustada para
          # reproducir ese layout; WebDriverAgentLib.framework se CONSERVA.
          for fw in Testing.framework XCTest.framework XCTestCore.framework XCTestSupport.framework XCUIAutomation.framework XCUnit.framework XCTAutomationSupport.framework libXCTestSwiftSupport.dylib; do
            rm -rf "$APP_PATH/Frameworks/$fw"
            find "$APP_PATH/PlugIns" -name "$fw" -exec rm -rf {} + 2>/dev/null || true
          done
          echo "--- Frameworks DESPUES del strip ---"
          ls "$APP_PATH/Frameworks" || true
          find "$APP_PATH/PlugIns" -type d -name Frameworks -exec ls {} \; || true
          echo "--- Referencias de los binarios principales ---"
          otool -L "$APP_PATH/WebDriverAgentRunner-Runner" || true
          XCTEST_BIN=$(find "$APP_PATH/PlugIns" -name 'WebDriverAgentRunner' -type f | head -n 1)
          echo "xctest bin: $XCTEST_BIN"
          otool -L "$XCTEST_BIN" || true
          if find "$APP_PATH" -name 'Testing.framework' -o -name 'lib_TestingInterop*' | grep -q .; then
            echo "::error::Sigue presente Testing.framework/lib_TestingInterop tras el strip"
            exit 1
          fi
          if otool -L "$APP_PATH/WebDriverAgentRunner-Runner" | grep -qi 'TestingInterop'; then
            echo "::error::El runner referencia lib_TestingInterop"
            exit 1
          fi
          echo "GUARD_OK: pila XCTest incrustada retirada; sin referencias a TestingInterop"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" -name 'WebDriverAgentRunner-Runner.app' -type d | head -n 1)
          echo "Runner app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf "$GITHUB_WORKSPACE/staging"
          mkdir -p "$GITHUB_WORKSPACE/staging/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/staging/Payload/"
          cd "$GITHUB_WORKSPACE/staging"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/WebDriverAgentRunner.ipa" Payload
          ls -l "$GITHUB_WORKSPACE/WebDriverAgentRunner.ipa"

      - name: IPA size and SHA-256
        run: |
          set -euo pipefail
          SIZE=$(stat -f%z "$GITHUB_WORKSPACE/WebDriverAgentRunner.ipa")
          SHA=$(shasum -a 256 "$GITHUB_WORKSPACE/WebDriverAgentRunner.ipa" | awk '{print $1}')
          echo "IPA_SIZE_BYTES=$SIZE"
          echo "IPA_SHA256=$SHA"
          {
            echo "## WebDriverAgentRunner.ipa (unsigned)"
            echo "- WDA revision: v10.5.4 (appium/WebDriverAgent), macos-15/Xcode 16.4 con STRIP de la pila XCTest incrustada (layout era Xcode 15: XCTest del dispositivo via DDI)"
            echo "- size_bytes: $SIZE"
            echo "- sha256: $SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa
          path: WebDriverAgentRunner.ipa
          if-no-files-found: error

