name: Build WebDriverAgent IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [tactil-wda]
    paths: [.github/workflows/build-wda.yml]

jobs:
  build-wda:
    runs-on: macos-14
    steps:
      - name: Checkout JARVIS-iOS (host repo)
        uses: actions/checkout@v4

      - name: Checkout appium/WebDriverAgent v10.5.4
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: v10.5.4
          path: WebDriverAgent-src

      - name: Select Xcode 15.x (sin Swift Testing)
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode_*.app || true
          XC=$(ls -d /Applications/Xcode_15*.app | sort -V | tail -n 1)
          echo "Seleccionado: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Build WebDriverAgentRunner (unsigned, build-for-testing)
        working-directory: WebDriverAgent-src
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$GITHUB_WORKSPACE/build/xcodebuild.log"

      - name: Compatibility guard (iOS 16 — no Swift Testing interop)
        run: |
          set -euo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" -name 'WebDriverAgentRunner-Runner.app' -type d | head -n 1)
          echo "Runner app: $APP_PATH"
          echo "--- Frameworks in app ---"
          ls "$APP_PATH/Frameworks" || true
          echo "--- Runner linked libraries ---"
          otool -L "$APP_PATH/WebDriverAgentRunner-Runner" || true
          if find "$APP_PATH" -name 'Testing.framework' -o -name 'lib_TestingInterop*' | grep -q .; then
            echo "::error::Artefacto INCOMPATIBLE con iOS 16: contiene Testing.framework/lib_TestingInterop"
            exit 1
          fi
          echo "GUARD_OK: sin Testing.framework ni lib_TestingInterop"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" -name 'WebDriverAgentRunner-Runner.app' -type d | head -n 1)
          echo "Runner app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf "$GITHUB_WORKSPACE/staging"
          mkdir -p "$GITHUB_WORKSPACE/staging/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/staging/Payload/"
          cd "$GITHUB_WORKSPACE/staging"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/WebDriverAgentRunner.ipa" Payload
          ls -l "$GITHUB_WORKSPACE/WebDriverAgentRunner.ipa"

      - name: IPA size and SHA-256
        run: |
          set -euo pipefail
          SIZE=$(stat -f%z "$GITHUB_WORKSPACE/WebDriverAgentRunner.ipa")
          SHA=$(shasum -a 256 "$GITHUB_WORKSPACE/WebDriverAgentRunner.ipa" | awk '{print $1}')
          echo "IPA_SIZE_BYTES=$SIZE"
          echo "IPA_SHA256=$SHA"
          {
            echo "## WebDriverAgentRunner.ipa (unsigned)"
            echo "- WDA revision: v10.5.4 (appium/WebDriverAgent), Xcode 15.x en macos-14 (Xcode >=16 inyecta Testing.framework: verificado en la corrida 46048246392)"
            echo "- size_bytes: $SIZE"
            echo "- sha256: $SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa
          path: WebDriverAgentRunner.ipa
          if-no-files-found: error

